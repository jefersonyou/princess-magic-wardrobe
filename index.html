<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f0e8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="마법 옷장"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><title>공주의 마법 옷장</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f0e8;color:#66536a;font-family:system-ui}main{min-height:100dvh;padding:max(20px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right));display:grid;grid-template-columns:1fr 300px;gap:24px}h1{font-size:24px}section{background:#fffaf5;border-radius:24px;padding:20px}#character{height:73dvh;width:100%;touch-action:none;overflow:hidden}#character canvas{display:block;margin:auto} .item svg{pointer-events:none}button:focus-visible{outline:3px solid #a582b9}aside{display:flex;flex-direction:column;gap:12px}button{min-height:48px;border:1px solid #dacbdf;border-radius:12px;background:#f4e8f3;color:#66536a;font-size:16px;touch-action:none}.item{width:100%;height:100px;display:flex;align-items:center;justify-content:center;gap:20px}.item svg{width:70px;height:88px}.ghost{position:fixed;width:100px;height:130px;pointer-events:none;z-index:5;transform:translate(-50%,-80%)}p{line-height:1.7;font-size:14px}#status{min-height:70px}.target{fill:#c7afd1;fill-opacity:.2;stroke:#a582b9;stroke-dasharray:4}.guides text{font-size:8px;fill:#584268}.guides circle{fill:#e85282}@media(orientation:portrait){main{grid-template-columns:1fr}#character{height:55dvh}} dialog{border:1px solid #dacbdf;border-radius:24px;padding:28px;max-width:90vw}dialog::backdrop{background:#30243a88}#items{display:grid;gap:8px}aside{gap:8px}aside h2{margin:8px 0}aside p{margin:8px 0}#status{min-height:40px}@media(orientation:landscape){main{height:100dvh;min-height:680px;overflow:auto}#character{height:calc(100dvh - 165px);min-height:500px}} </style><main><section><small>PRINCESS’S MAGIC WARDROBE</small><h1>공주의 마법 옷장</h1><div id="character"></div></section><aside><h2>드레스 · 신발 · 왕관</h2><p>드레스는 몸으로, 왕관은 머리로, 구두는 발로 끌어주세요.</p><div id="items"></div><button id="guides">기준점 표시 / 숨기기</button><button id="reset">모두 벗기기</button><p id="status" role="status">왕관은 머리, 드레스는 허리, 신발은 발로 끌어주세요.</p><p><span id="offline-status">설치 준비 중…</span></p><button id="install-help">iPad에 설치하기</button><small>v0.2.0 · 공주 옷 입히기</small><dialog id="install-dialog"><h2>홈 화면에 설치하기</h2><p>iPad Safari에서 이 주소를 열고<br>공유 버튼 → 홈 화면에 추가 → 추가를 눌러주세요.</p><p>아래에 ‘오프라인 준비 완료’가 표시된 뒤 설치하면<br>인터넷 없이도 옷을 갈아입힐 수 있어요.</p><button id="close-install">닫기</button></dialog></aside></main><script type="module" src="./src/phase0/main.ts"></script><script type="module" src="./src/install.ts"></script></html>

<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Phase 0 · 착용 정렬 검증</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f0e8;color:#66536a;font-family:system-ui}main{min-height:100dvh;padding:max(20px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right));display:grid;grid-template-columns:1fr 300px;gap:24px}h1{font-size:24px}section{background:#fffaf5;border-radius:24px;padding:20px}#character{height:73dvh;width:100%;touch-action:none;overflow:hidden}#character canvas{display:block;margin:auto} .item svg{pointer-events:none}button:focus-visible{outline:3px solid #a582b9}aside{display:flex;flex-direction:column;gap:12px}button{min-height:48px;border:1px solid #dacbdf;border-radius:12px;background:#f4e8f3;color:#66536a;font-size:16px;touch-action:none}.item{width:100%;height:100px;display:flex;align-items:center;justify-content:center;gap:20px}.item svg{width:70px;height:88px}.ghost{position:fixed;width:100px;height:130px;pointer-events:none;z-index:5;transform:translate(-50%,-80%)}p{line-height:1.7;font-size:14px}#status{min-height:70px}.target{fill:#c7afd1;fill-opacity:.2;stroke:#a582b9;stroke-dasharray:4}.guides text{font-size:8px;fill:#584268}.guides circle{fill:#e85282}@media(orientation:portrait){main{grid-template-columns:1fr}#character{height:55dvh}} </style><main><section><small>PHASE 0 · ASSET ALIGNMENT LAB</small><h1>공주의 마법 옷장</h1><div id="character"></div></section><aside><h2>드레스 · 신발 · 왕관</h2><p>옷을 해당 신체 부위로 끌어주세요. 세 의상을 함께 착용해 정렬을 확인할 수 있어요.</p><div id="items"></div><button id="guides">기준점 표시 / 숨기기</button><button id="reset">모두 벗기기</button><p id="status" role="status">왕관은 머리, 드레스는 허리, 신발은 발로 끌어주세요.</p><p>확정한 공주 시안을 적용한 착용 검증 화면입니다.</p><a href="../">기존 프로토타입</a></aside></main><script type="module" src="../src/phase0/main.ts"></script></html>
